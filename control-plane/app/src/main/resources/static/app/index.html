<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecDrill CTF</title>
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Minimal T07 screens (prompt 08). The real Web workspace is T11 (D-06). -->
  <header>
    <h1>SecDrill</h1>
    <p id="demo-banner" class="banner" hidden>데모 환경: 격리가 검증되지 않은 runtime(local-trusted)에서 실행 중입니다. 결과는 공식 결과가 아닙니다.</p>
  </header>
  <main>
    <section id="login">
      <h2>로그인</h2>
      <p><a href="/oauth2/authorization/oidc">OIDC로 로그인</a></p>
      <p><button type="button" id="dev-login">개발용 로그인(local profile)</button></p>
    </section>

    <section id="catalog" hidden>
      <h2>사건 선택</h2>
      <ul id="scenarios"></ul>
    </section>

    <section id="scenario" hidden>
      <h2 id="scenario-title"></h2>
      <p id="scenario-brief"></p>
      <p>허용 대상: <span id="scenario-targets"></span></p>
      <button type="button" id="start">CTF Session 시작</button>
    </section>

    <section id="session" hidden>
      <h2>Session</h2>
      <dl>
        <dt>상태</dt><dd id="session-status"></dd>
        <dt>Lab</dt><dd id="lab-status">요청 전</dd>
      </dl>
      <button type="button" id="request-lab">Lab 준비</button>
      <button type="button" id="open-lab" disabled>Lab 열기(별도 origin)</button>
      <form id="flag-form">
        <label for="challenge">목표</label>
        <select id="challenge"></select>
        <label for="flag">플래그</label>
        <input id="flag" autocomplete="off" maxlength="256" required>
        <button type="submit">제출</button>
      </form>
      <div id="result" aria-live="polite"></div>
      <button type="button" id="finish">완료하고 Lab 종료</button>
      <button type="button" id="stop">중단</button>
    </section>
    <p id="error" class="error" role="alert"></p>
  </main>
</body>
</html>
