spring:
  application:
    name: secdrill-control-plane
  main:
    banner-mode: off
  datasource:
    url: ${SECDRILL_DB_URL:jdbc:postgresql://127.0.0.1:5432/secdrill}
    username: ${SECDRILL_DB_USER:secdrill}
    password: ${SECDRILL_DB_PASSWORD:}
    hikari:
      connection-timeout: 3000
  flyway:
    # Schema changes come only from versioned migrations (14). Applying them on start is opt-in.
    enabled: ${SECDRILL_DB_MIGRATE_ON_START:false}
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
