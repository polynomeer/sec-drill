spring:
  application:
    name: secdrill-control-plane
  main:
    banner-mode: off
  datasource:
    url: ${SECDRILL_DB_URL:jdbc:postgresql://127.0.0.1:5432/secdrill}
    username: ${SECDRILL_DB_USER:secdrill}
    password: ${SECDRILL_DB_PASSWORD:}
    hikari:
      connection-timeout: 3000
  flyway:
    # Schema changes come only from versioned migrations (14). Applying them on start is opt-in.
    enabled: ${SECDRILL_DB_MIGRATE_ON_START:false}
    locations: classpath:db/migration
  rabbitmq:
    host: ${SECDRILL_RABBITMQ_HOST:127.0.0.1}
    port: ${SECDRILL_RABBITMQ_PORT:5672}
    username: ${SECDRILL_RABBITMQ_USER:secdrill}
    password: ${SECDRILL_RABBITMQ_PASSWORD:}
    connection-timeout: 2s
    # ADR 0004: an Outbox row is published only after a broker ack for a routed message.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: true
        acknowledge-mode: auto
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false

secdrill:
  auth:
    # Exact Origin values for unsafe methods; empty rejects every unsafe request (fail closed).
    allowed-origins: ${SECDRILL_ALLOWED_ORIGINS:}
    dev-login:
      enabled: false
# OIDC (ADR 0002): set the standard Spring properties through the environment, for example
# SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_ID / _CLIENT_SECRET / _SCOPE=openid and
# SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI. Without them OIDC login is not mounted.

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
