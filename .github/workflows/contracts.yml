name: contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install validators
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      # Documents, contracts, config and ignore rules.
      - name: Check documents and contracts
        run: .venv/bin/python scripts/check.py --strict

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      # Validates the wrapper jar checksum and caches Gradle downloads.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Unit, contract-catalog, Control DB boundary and PostgreSQL (Testcontainers) tests.
      - name: Build and test
        run: ./gradlew check --console=plain
