name: contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install validators
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      # Documents, contracts, config and ignore rules.
      - name: Check documents and contracts
        run: .venv/bin/python scripts/check.py --strict

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      # Validates the wrapper jar checksum and caches Gradle downloads.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Unit, contract-catalog, Control DB boundary and PostgreSQL (Testcontainers) tests.
      - name: Build and test
        run: ./gradlew check --console=plain

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.20"
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      # API types must match the OpenAPI contract; the build type-checks the app and the E2E code.
      - name: Check API types and build
        run: |
          npm run check:api
          npm run build
      - name: Browser tests (keyboard, small screen, escaping, origin, reconnect, error messages)
        run: |
          PLAYWRIGHT_BROWSERS_PATH=.playwright npx playwright install --with-deps chromium
          PLAYWRIGHT_BROWSERS_PATH=.playwright npm run e2e
