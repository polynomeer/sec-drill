name: contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install validators
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      # Documents, contracts, config and ignore rules only. No product build or runtime test exists yet.
      - name: Check documents and contracts
        run: .venv/bin/python scripts/check.py --strict
