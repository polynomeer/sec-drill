# Local development database only. Tests start their own containers (Testcontainers).
services:
  postgres:
    # postgres:18.6-alpine, pinned by digest (D-02). Keep in sync with TestPostgres.kt.
    image: postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: secdrill
      POSTGRES_USER: secdrill
      POSTGRES_PASSWORD: secdrill-local-dev
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secdrill -d secdrill"]
      interval: 2s
      timeout: 2s
      retries: 15

  rabbitmq:
    # rabbitmq:4.3.6-alpine, pinned by digest (D-08). Keep in sync with TestBroker in IntegrationTest.kt.
    image: rabbitmq@sha256:2cb43283d8bbd3caa6c0f0dc00e96c8de772df33df7fd8af6aee4d605aeb8ada
    environment:
      RABBITMQ_DEFAULT_USER: secdrill
      RABBITMQ_DEFAULT_PASS: secdrill-local-dev
    ports:
      - "127.0.0.1:5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
