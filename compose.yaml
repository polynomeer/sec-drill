# Local development database only. Tests start their own containers (Testcontainers).
services:
  postgres:
    # postgres:18.6-alpine, pinned by digest (D-02). Keep in sync with TestPostgres.kt.
    image: postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: secdrill
      POSTGRES_USER: secdrill
      POSTGRES_PASSWORD: secdrill-local-dev
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secdrill -d secdrill"]
      interval: 2s
      timeout: 2s
      retries: 15
