  "components": {
    "securitySchemes": {
      "cookieAuth": {
        "type": "apiKey",
        "in": "cookie",
        "name": "access_session"
      }
    },
    "parameters": {
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        },
        "description": "owner+route 기준24시간; 같은 body는 최초 응답, 다른 body는409"
      },
      "CsrfToken": {
        "name": "X-CSRF-Token",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 16,
          "maxLength": 256
        }
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "requestId": {
            "type": "string"
          },
          "retryable": {
            "type": "boolean"
          },
          "details": {
            "type": "object",
            "additionalProperties": true
          }
        },
        "required": [
          "code",
          "message",
          "requestId",
          "retryable"
        ]
      },
      "VersionCommand": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "expectedVersion": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "expectedVersion"
        ]
      },
      "SessionCreate": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "scenarioVersionId": {
            "type": "string",
            "format": "uuid"
          },
          "mode": {
            "type": "string",
            "enum": [
              "CTF",
              "WARGAME",
              "PURPLE",
              "PATCH",
              "DETECTION",
              "INVESTIGATE"
            ]
          },
          "parentSessionId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "scenarioVersionId",
          "mode"
        ]
      },
      "Session": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "scenarioVersionId": {
            "type": "string",
            "format": "uuid"
          },
          "mode": {
            "type": "string",
            "enum": [
              "CTF",
              "WARGAME",
              "PURPLE",
              "PATCH",
              "DETECTION",
              "INVESTIGATE"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "CREATED",
              "ACTIVE",
              "SUBMITTED",
              "EVALUATING",
              "COMPLETED",
              "CANCELLED",
              "EXPIRED",
              "EVALUATION_FAILED"
            ]
          },
          "phase": {
            "type": "string",
            "enum": [
              "ANALYZE",
              "ATTACK",
              "OBSERVE",
              "DETECT",
              "CONTAIN",
              "PATCH",
              "VERIFY",
              "POSTMORTEM"
            ]
          },
          "version": {
            "type": "integer",
            "minimum": 0
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "lab": {
            "$ref": "#/components/schemas/Lab"
          }
        },
        "required": [
          "id",
          "scenarioVersionId",
          "mode",
          "status",
          "phase",
          "version",
          "createdAt"
        ]
      },
      "Lab": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "sessionId": {
            "type": "string",
            "format": "uuid"
          },
          "generation": {
            "type": "integer",
            "minimum": 1
          },
          "state": {
            "type": "string",
            "enum": [
              "REQUESTED",
              "PROVISIONING",
              "READY",
              "TERMINATING",
              "TERMINATED",
              "FAILED",
              "CLEANUP_FAILED"
            ]
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "connectPath": {
            "type": "string"
          }
        },
        "required": [
          "id",
          "sessionId",
          "generation",
          "state",
          "expiresAt"
        ]
      },
      "Scenario": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "scenarioVersionId": {
            "type": "string",
            "format": "uuid"
          },
          "title": {
            "type": "string"
          },
          "difficulty": {
            "type": "string",
            "enum": [
              "BEGINNER",
              "INTERMEDIATE",
              "ADVANCED"
            ]
          },
          "modes": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "CTF",
                "WARGAME",
                "PURPLE",
                "PATCH",
                "DETECTION",
                "INVESTIGATE"
              ]
            }
          },
          "competencyTags": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "estimatedMinutes": {
            "type": "integer",
            "minimum": 1
          }
        },
        "required": [
          "id",
          "scenarioVersionId",
          "title",
          "difficulty",
          "modes",
          "competencyTags",
          "estimatedMinutes"
        ]
      },
      "ScenarioPage": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Scenario"
            }
          },
